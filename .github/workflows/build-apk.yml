name: Build Android APK (Army 2)

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'core/**'
      - 'android/**'
      - 'assets/**'
      - 'resources/**'
      - 'lib/**'
      - '*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          ls "$SDK/platforms" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: |
          ./gradlew :android:assembleDebug --stacktrace

      - name: Package APK
        run: |
          mkdir -p output_apk
          find android/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apk/Army2-TuoiTho.apk \;
          
          if [ ! -f "output_apk/Army2-TuoiTho.apk" ]; then
            find android/build/outputs/apk -name "*.apk" -exec cp {} output_apk/Army2-TuoiTho.apk \; || true
          fi

          ls -la output_apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "apk-v1.0.${{ github.run_number }}"
          name: "Army 2 Android APK Build #${{ github.run_number }}"
          body: "Tự động tạo bản dựng Army 2 Android APK (Run #${{ github.run_number }})"
          draft: false
          prerelease: false
          files: output_apk/Army2-TuoiTho.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Direct Download Link
        run: |
          echo "=========================================================="
          echo " LINK TẢI APK TRỰC TIẾP TỐC ĐỘ CAO:"
          echo "- Link BashUpload:"
          curl -s https://bashupload.com/Army2-TuoiTho.apk --data-binary @output_apk/Army2-TuoiTho.apk || true
          echo ""
          echo "- Link Temp.sh:"
          curl -s -F "file=@output_apk/Army2-TuoiTho.apk" https://temp.sh/upload || true
          echo ""
          echo "=========================================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Army2-TuoiTho-Android-APK
          path: output_apk/Army2-TuoiTho.apk
          retention-days: 1
          if-no-files-found: warn
