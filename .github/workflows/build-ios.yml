name: Build iOS IPA (Army 2)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Self-Signed Certificate in macOS Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD="ci_temp_password"
          
          echo "Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "Generating self-signed code signing certificate..."
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 365 -nodes \
            -subj "/CN=iPhone Developer: CI/O=Army2/C=VN"
          
          openssl pkcs12 -export -out /tmp/cert.p12 -inkey /tmp/key.pem -in /tmp/cert.pem -passout pass:"$KEYCHAIN_PASSWORD"
          
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          
          echo "Available Identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Compile and Build iOS IPA with RoboVM
        run: |
          ./gradlew :ios:createIPA --stacktrace || ./gradlew :ios:robovmInstall --stacktrace || true

      - name: Package IPA (Payload structure)
        run: |
          mkdir -p output_ipa
          
          echo "Listing all contents of ios/build:"
          find ios/build -maxdepth 3 || true
          
          echo "Checking robovm output files..."
          ls -la ios/build/ || true
          ls -la ios/build/robovm/ || true
          
          # If an IPA was generated directly
          if ls ios/build/robovm/*.ipa 1> /dev/null 2>&1; then
            echo "Found IPA created by RoboVM"
            cp ios/build/robovm/*.ipa output_ipa/Army2-TuoiTho.ipa
          fi
          
          # If .app folder was generated, package into standard IPA
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Packaging App from $APP_PATH into output_ipa/Army2-TuoiTho.ipa"
            mkdir -p payload_dir/Payload
            cp -R "$APP_PATH" payload_dir/Payload/
            cd payload_dir && zip -qr ../output_ipa/Army2-TuoiTho.ipa Payload/ && cd ..
          fi
          
          # Fallback check
          if [ ! -f "output_ipa/Army2-TuoiTho.ipa" ]; then
            echo "Searching whole build directory for any iOS artifacts..."
            find ios/build -name "*.ipa" -exec cp {} output_ipa/Army2-TuoiTho.ipa \; || true
          fi
          
          ls -la output_ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Army2-TuoiTho-iOS-IPA
          path: output_ipa/Army2-TuoiTho.ipa
          retention-days: 1
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Army 2 iOS Build #${{ github.run_number }}"
          body: "Tự động tạo bản dựng Army 2 iOS IPA (Run #${{ github.run_number }})"
          draft: false
          prerelease: false
          files: output_ipa/Army2-TuoiTho.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Direct Download Link
        run: |
          echo "=========================================================="
          echo " LINK TẢI IPA TRỰC TIẾP (HẠN DÙNG 7 NGÀY):"
          curl -s https://bashupload.com/Army2-TuoiTho.ipa --data-binary @output_ipa/Army2-TuoiTho.ipa || true
          echo ""
          echo "=========================================================="
