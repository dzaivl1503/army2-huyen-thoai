[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

sourceSets {
  main {
    java {
      srcDirs = [
        'src/main/java'
      ]
      exclude '**/tool/**'
    }
    resources {
      srcDirs = [
        rootProject.file('assets')
      ]
    }
  }
}

dependencies {
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
}
// Sinh lai 6 tab doc lap (tab.tab1..tab.tab6) tu src/game + tools/tab_template.
// Chay sau khi sua src/game:  gradlew :core:generateTabs   (Windows)
tasks.register('generateTabs', Exec) {
  onlyIf { System.getProperty('os.name').toLowerCase().contains('windows') }
  workingDir rootProject.projectDir
  commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tools/generate_tabs.ps1'
}